<!DOCTYPE html>

<html lang="en">
  {% include head.html %}

  <body class="{{ layout.class }}">
    <a class="skip-link" href="#main-content">Skip to main content</a>

    {% unless page.header == false %}
      {% include header.html %}
    {% endunless %}

    <main id="main-content" class="page-content">
      {{ content }}
    </main>

    {% unless page.footer == false %}
      {% include footer.html %}
    {% endunless %}

    {% include scripts.html %}

  </body>

</html>
